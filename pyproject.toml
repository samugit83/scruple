[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scruple"
version = "0.1.0"
description = "Qualitative coding that codes what it's sure of, refuses the rest, and proves both."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "scruple contributors" }]
keywords = [
    "qualitative-research",
    "content-analysis",
    "inter-rater-reliability",
    "calibration",
    "conformal-prediction",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "rich>=13.0",
    "typer>=0.12",
]

[project.optional-dependencies]
chart = ["matplotlib>=3.7"]
parquet = ["pyarrow>=14.0"]
stata = ["pandas>=2.0"]
spss = ["pyreadstat>=1.2"]
all = ["matplotlib>=3.7", "pyarrow>=14.0", "pyreadstat>=1.2"]

[project.urls]
Homepage = "https://github.com/scruple-tool/scruple"
Documentation = "https://github.com/scruple-tool/scruple/tree/main/docs"
Source = "https://github.com/scruple-tool/scruple"

[project.scripts]
scruple = "scruple.cli.main:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "mypy>=1.10",
    "ruff>=0.5",
    "types-PyYAML>=6.0",
    "pandas-stubs>=2.0",
    "matplotlib>=3.7",
    "pyarrow>=14.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/scruple"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "bench"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "PT", "SIM", "RUF"]
ignore = ["N818"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
disallow_untyped_defs = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = "scruple.stats.*"
strict = true

[[tool.mypy.overrides]]
module = ["scipy.*", "pyreadstat.*", "matplotlib.*", "hypothesis.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "statistical: slow simulation tests validating the guarantee (deselect with -m 'not statistical')",
    "slow: long-running performance guards",
]
filterwarnings = ["error::DeprecationWarning:scruple.*"]

[tool.coverage.run]
branch = true
source = ["src/scruple"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]
